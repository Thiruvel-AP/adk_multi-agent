services:
  agentic-friend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/agentic-friend-backend/config/.env
    volumes:
      # Memory file
      - ./backend/agentic-friend-backend/Memory:/app/memory_data
      # Voice files for TTS
      - ./backend/agentic-friend-backend/hf_voice_synthesis/voices:/app/hf_voice_synthesis/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - PYTHONUNBUFFERED=1
      - MEMORY_DIR=/app/memory_data
    # Command is already in Dockerfile, but you can override here if needed
    # command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
              